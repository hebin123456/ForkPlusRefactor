name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release)
        run: dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::GCS_FILES=$(find src/ForkPlus.Avalonia/obj -name '*.g.cs' 2>/dev/null | tr '\n' ' ')"
          echo "::error::BUILD_DONE"
