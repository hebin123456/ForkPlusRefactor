name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
          echo "::error::GCS_FILES=$(grep -oE 'GeneratedFiles/[^ ]+\.g\.cs' /tmp/build.log | sort -u | tr '\n' '|' 2>/dev/null)"
          echo "::error::BUILD_OK=$(grep -cE 'Build succeeded|0 Error' /tmp/build.log 2>/dev/null)"
