name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dump SDK CoreCompile Csc call
        run: |
          SDS=$(dotnet --list-sdks | sed -E 's/.*\[(.*)\]/\1/')
          echo "SDKS=$SDS"
          F=""
          for d in $SDS; do
            cand=$(find "$d" -name 'Microsoft.CSharp.CurrentVersion.targets' 2>/dev/null | head -1)
            [ -n "$cand" ] && F="$cand" && break
          done
          echo "FILE=$F"
          echo "::error::SDK_TTBC_COUNT=$(grep -c 'TargetsTriggeredByCompilation' "$F" 2>/dev/null)"
          # show CoreCompile's Csc invocation context around TargetsTriggeredByCompilation
          grep -n -B1 -A1 'TargetsTriggeredByCompilation' "$F" 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error::SDK_TTBC $l"; done
          # show the <Csc ...> element inside CoreCompile (look for Csc task usage)
          grep -n '<Csc' "$F" 2>/dev/null | head -5 | while IFS= read -r l; do echo "::error::SDK_CSC $l"; done

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::CSC_PARAM_TTBC=$(grep -A140 'Task "Csc"' /tmp/build.log | grep -i 'TargetsTriggeredByCompilation' | head -2)"
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
