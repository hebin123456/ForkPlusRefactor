name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release)
        run: dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 捕获 dotnet test 完整输出（含崩溃栈）；|| true 保证即使宿主崩溃也继续。
      - name: Test (xUnit + Avalonia Headless)
        run: dotnet test src/ForkPlus.Avalonia.Tests/ForkPlus.Avalonia.Tests.csproj -c Release --logger "console;verbosity=detailed" > test_output.txt 2>&1 || true

      # 把断言失败的关键行（Expected/Actual/Strings differ）作为 ::error:: 注解发出。
      - name: Surface test output as annotations
        if: always()
        run: |
          { grep -niE "expected|actual|strings differ|assert\.equal|failure|position|differ" test_output.txt | tail -n 120; echo "---- TAIL ----"; tail -n 60 test_output.txt; } \
            | sed 's/::/__/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: Fail if tests did not pass
        run: grep -Eq "Passed!" test_output.txt && ! grep -Eq "Failed!" test_output.txt
