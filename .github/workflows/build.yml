name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

# 全局并发：同一 ref 上有 in_progress run 时，自动 cancel 旧的，
# 避免 push 后旧 run 还在跑（特别是 macOS publish 慢，3 个 RID × 3 OS 容易排队）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 构建 Release：单平台即可（ubuntu），后面 test 会在三平台各自 build。
  # 加 timeout-minutes 兜底，避免 runner 卡死后整个 workflow 永远 yellow。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release)
        run: dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release

  # M0：biturbo 原生库三平台加载验证 + 全量测试（含 Avalonia Headless UI 测试）。
  # 用单一 test matrix 取代原先独立的 biturbo-smoke 作业：
  #   - biturbo-smoke 用 xUnit v3 的 --filter 在三平台偶发 0 匹配（dotnet test 退出码 1），
  #     与已通过的全量 test（ubuntu 22 测试）矛盾，故回归到全量运行，彻底绕开 filter 问题。
  #   - defaults.run.shell: bash 让所有 OS 的 run: 步骤走 bash（Windows runner 默认 PowerShell
  #     会让 grep/sed/$? 失效，且曾因 MSBuild 把 PowerShell 的 $_ 当属性导致 MSB4184）。
  #   - BiturboSmokeTests（plain [Fact]，触发 Bt 静态构造加载原生库）已包含在全量套件，
  #     三平台全绿即证明 biturbo.dll / libbiturbo.so / libbiturbo.dylib 均可被 DllImportResolver 加载。
  test:
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 捕获 dotnet test 真实退出码（不靠脆弱的汇总文本匹配），输出落盘供注解回传。
      - name: Test (xUnit + Avalonia Headless)
        run: dotnet test src/ForkPlus.Avalonia.Tests/ForkPlus.Avalonia.Tests.csproj -c Release --logger "console;verbosity=normal" > test_output.txt 2>&1; echo $? > test_exit.txt

      # 仅当测试真正失败（test_exit.txt != 0）时才把失败/原生库加载行作为 ::error:: 注解发出。
      # 注意：原先这里 if: always() 且无条件把 test_output.txt 末尾 40 行当 ::error:: 发出，
      # 导致每次绿跑也在 Checks/提交视图刷出约 40 条红色注解（BiturboSmokeTests 命中 biturbo 过滤、
      # Passed! 摘要等），看起来像"CI 挂了"但 job 结论其实是 success。故改为按退出码门控。
      - name: Surface failures as annotations
        if: always()
        run: |
          if [ "$(cat test_exit.txt 2>/dev/null)" != "0" ]; then
            echo "::group::failure grep"
            grep -niE "failed fork|assert\.|exception|expected:|actual:|nullreference|unhandled|error cs|avalonia is not|dllnotfound|badimage|could not load|biturbo" test_output.txt | head -n 50 | sed 's/::/__/g' | while IFS= read -r line; do echo "::error::$line"; done
            echo "---- TAIL ----"; tail -n 40 test_output.txt | sed 's/::/__/g' | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
          else
            echo "tests passed (test_exit.txt=0) — no annotations emitted"
          fi

      # 以 dotnet test 真实退出码作为门槛，避免 xunit v3 汇总格式差异导致误判。
      - name: Fail if tests did not pass
        run: test "$(cat test_exit.txt)" = "0"

      # 上传 test_output.txt 作为 artifact（即便失败也保留，便于本地复现/诊断）。
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test_output.txt
          retention-days: 7
          if-no-files-found: ignore

  # P5：三平台自包含单文件发布（Avalonia 单文件方案），产物作为 artifact 供下载。
  # 关键修复：
  #   1) 加 timeout-minutes 25 —— 之前没设，self-contained + PublishSingleFile + native libs
  #      在 macOS arm64 runner 上能跑 10+ 分钟，超过 GitHub 默认 6h 之前会被外部超时，
  #      但中间 runner 长时间无任何 step 状态刷新看起来像"卡住"。显式 25 分钟让进度更明确。
  #   2) 上传 artifact 加 retention-days / if-no-files-found —— actions/upload-artifact@v4 默认
  #      找不到文件会 hard fail 让 publish step 挂红。
  #   3) 把 publish 从 test 拆出来（之前 needs: build）—— 即使某 OS 测试挂了，
  #      其他 OS 的发布产物还能继续出；workflow_dispatch 也能单独触发发布。
  publish:
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # RID ↔ OS 配对：publish 必须用对应平台 runner，否则 dotnet publish -r osx-arm64
        # 在 ubuntu runner 上会失败（Mac .NET runtime 必须在 Mac 上恢复）。
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained single-file)
        run: dotnet publish src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForkPlus.Avalonia-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
