name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Preprocess (dump target conditions)
        continue-on-error: true
        run: |
          dotnet msbuild src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj -pp:/tmp/pp.xml -p:EnableAvaloniaXamlCompilation=true 2>&1 | tail -3
          echo "=== PP count CompileAvaloniaXaml ==="
          grep -c 'CompileAvaloniaXaml' /tmp/pp.xml | xargs -I{} echo "::error::PP_COUNT CompileAvaloniaXaml occurrences: {}"
          echo "=== PP target condition (CompileAvaloniaXaml) ==="
          grep -n -A4 'Name="CompileAvaloniaXaml"' /tmp/pp.xml | head -30 | while IFS= read -r l; do echo "::error::PP_CAX $l"; done
          echo "=== PP _AvaloniaSkipXamlCompilation assignments ==="
          grep -n '_AvaloniaSkipXamlCompilation' /tmp/pp.xml | head -25 | while IFS= read -r l; do echo "::error::PP_SKIP $l"; done
          echo "=== PP InitializeComponent generator ==="
          grep -n 'InitializeComponent' /tmp/pp.xml | head -10 | while IFS= read -r l; do echo "::error::PP_INIT $l"; done

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::BUILD_SKIPCOUNT=$(grep -ci 'skipped' /tmp/build.log 2>/dev/null)"
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
          echo "::error::GCS_FILES=$(find obj -name '*.g.cs' 2>/dev/null | tr '\n' ' ')"
          grep -iE 'Target "CompileAvaloniaXaml' /tmp/build.log | head -10 | while IFS= read -r l; do echo "::error::CAXRUN $l"; done
          grep -iE 'CompileAvaloniaXaml' /tmp/build.log | head -25 | while IFS= read -r l; do echo "::error::CAX $l"; done
          grep -iE 'skipped.*CompileAvaloniaXaml|CompileAvaloniaXaml.*skipped|Skipping target "CompileAvaloniaXaml' /tmp/build.log | head -10 | while IFS= read -r l; do echo "::error::SKIPCXX $l"; done
          grep -iE 'error CS|error MSB|XamlIl|XamlX|XAML compiler|AvaloniaXamlTask|Exception|threw' /tmp/build.log | head -50 | while IFS= read -r l; do echo "::error::ERR $l"; done
          echo "=== PP CompileAvaloniaXaml target body ==="
          grep -n -B2 -A30 'Name="CompileAvaloniaXaml"' /tmp/pp.xml | head -45 | while IFS= read -r l; do echo "::error::PP_BODY $l"; done
          tail -25 /tmp/build.log | while IFS= read -r l; do echo "::error::TAIL $l"; done
