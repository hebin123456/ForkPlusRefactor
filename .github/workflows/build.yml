name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release)
        run: dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 捕获 dotnet test 退出码（不靠脆弱的汇总文本匹配），输出落盘供注解回传。
      - name: Test (xUnit + Avalonia Headless)
        run: dotnet test src/ForkPlus.Avalonia.Tests/ForkPlus.Avalonia.Tests.csproj -c Release --logger "console;verbosity=normal" > test_output.txt 2>&1; echo $? > test_exit.txt

      # 抓取失败/汇总相关行作为 ::error:: 注解（镜像 annotations API 可读）。
      - name: Surface test output as annotations
        if: always()
        run: grep -niE "failed|assert|exception|expected:|actual:|failure|stack|nullreference|passed|total|tests" test_output.txt | head -n 50 | sed 's/::/__/g' | while IFS= read -r line; do echo "::error::$line"; done

      # 以 dotnet test 真实退出码作为门槛，避免 xunit v3 汇总格式差异导致误判。
      - name: Fail if tests did not pass
        run: test "$(cat test_exit.txt)" = "0"
