name: Build

# 每次向 main 推送、或开 PR 到 main 时，构建 Avalonia 迁移工程，确保跨平台可编译。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: XAML diagnostics
        if: always()
        run: |
          grep -nE "CompileAvaloniaXaml|GenerateAvaloniaResources|InitializeComponent|The \".*\" task|Could not load|exception|MSB[0-9]{4}" /tmp/build.log | head -60 | while IFS= read -r line; do echo "::error::DIAG $line"; done
          echo "::error::TAIL ==="
          tail -45 /tmp/build.log | while IFS= read -r line; do echo "::error::TAIL $line"; done
