name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dump SDK CoreCompile <Csc> call (compressed)
        run: |
          SDS=$(dotnet --list-sdks | sed -E 's/.*\[(.*)\]/\1/')
          F=""
          for d in $SDS; do
            cand=$(find "$d" -name 'Microsoft.CSharp.CurrentVersion.targets' 2>/dev/null | head -1)
            [ -n "$cand" ] && F="$cand" && break
          done
          START=$(grep -n 'Name="CoreCompile"' "$F" | head -1 | cut -d: -f1)
          # find the <Csc ...> ... /> element starting near START+10
          sed -n "${START},$((START+200))p" "$F" | awk '/<Csc /{f=1} f{printf "%s ", $0} /\/>/{if(f){print; exit}}' > /tmp/csc.txt
          echo "::error::CSC_CALL $(cat /tmp/csc.txt)"
          echo "::error::HAS_TTBC=$(grep -c TargetsTriggeredByCompilation /tmp/csc.txt 2>/dev/null)"

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
