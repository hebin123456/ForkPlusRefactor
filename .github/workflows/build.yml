name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dump SDK CoreCompile handling of TargetsTriggeredByCompilation
        run: |
          SDK=$(dotnet --list-sdks --print-path 2>/dev/null | head -1)
          echo "SDK=$SDK"
          F=$(find "$SDK" -name 'Microsoft.CSharp.CurrentVersion.targets' 2>/dev/null | head -1)
          echo "FILE=$F"
          echo "::error::SDK_TTBC_COUNT=$(grep -c 'TargetsTriggeredByCompilation' "$F" 2>/dev/null)"
          echo "::error::SDK_CALL=$(grep -n 'CallTarget Targets="$(TargetsTriggeredByCompilation)"' "$F" 2>/dev/null | head -3)"
          grep -n 'TargetsTriggeredByCompilation' "$F" 2>/dev/null | head -5 | while IFS= read -r l; do echo "::error::SDK_LINE $l"; done

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::CSC_PARAM=$(grep -A60 'Task "Csc"' /tmp/build.log | grep -i 'TargetsTriggeredByCompilation' | head -3)"
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
          echo "::error::CSC_TTBC_LOG=$(grep -c 'TargetsTriggeredByCompilation' /tmp/build.log 2>/dev/null)"
          grep -iE 'error CS0103' /tmp/build.log | head -3 | while IFS= read -r l; do echo "::error::ERR $l"; done
