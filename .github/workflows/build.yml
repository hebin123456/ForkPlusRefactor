name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dump SDK CoreCompile Csc call
        run: |
          SDS=$(dotnet --list-sdks | sed -E 's/.*\[(.*)\]/\1/')
          F=""
          for d in $SDS; do
            cand=$(find "$d" -name 'Microsoft.CSharp.CurrentVersion.targets' 2>/dev/null | head -1)
            [ -n "$cand" ] && F="$cand" && break
          done
          echo "FILE=$F"
          START=$(grep -n 'Name="CoreCompile"' "$F" | head -1 | cut -d: -f1)
          echo "CORECOMPILE_START=$START"
          # emit the Csc call region (lines START..START+120) in chunks
          sed -n "${START},$((START+120))p" "$F" | sed -n '1,60p' | while IFS= read -r l; do echo "::error::CC1 $l"; done
          sed -n "${START},$((START+120))p" | sed -n '61,120p' | while IFS= read -r l; do echo "::error::CC2 $l"; done

      - name: Restore
        run: dotnet restore src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj

      - name: Build (Release, diag)
        run: |
          set -o pipefail
          dotnet build src/ForkPlus.Avalonia/ForkPlus.Avalonia.csproj --no-restore -c Release -v diag 2>&1 | tee /tmp/build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "::error::CAX_EXEC=$(grep -c 'Target "CompileAvaloniaXaml"' /tmp/build.log 2>/dev/null)"
